name: Hata raporu
description: Beklediğiniz gibi çalışmayan bir şey mi var?
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Kişisel dosya, ses kaydı veya özel yol içeren ekran görüntülerini paylaşmadan önce kontrol edin.
  - type: input
    id: version
    attributes:
      label: Uygulama sürümü
      placeholder: "0.1.0 (alfa)"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows sürümü
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Alan
      options: [Tasarım, Video, Ses, Altyazı / Whisper, Proje / kayıt, Kurulum, Diğer]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Adımlar
      description: Hatayı yeniden üretmek için ne yaptınız?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen ve gerçekleşen davranış
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Hata iletisi (varsa olduğu gibi yapıştırın)
      render: text
