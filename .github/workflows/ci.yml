name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Gerçek FFmpeg gerektiren testler FFmpeg bulunamazsa atlanır; paketlenmiş sürümü indirip PATH'e ekleyerek çalıştırırız.
      - name: FFmpeg hazırla
        shell: pwsh
        run: |
          ./scripts/fetch-ffmpeg.ps1
          "$PWD/src-tauri/resources/ffmpeg" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: cargo clippy --all-targets
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
